# Builds the VS Code extension and attaches the .vsix to a GitHub Release.

name: Release VS Code extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-githrun

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: vscode-githrun/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Check tag matches package.json version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION="$(node -p "require('./package.json').version")"
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
          exit 1
        fi

    - name: Package VSIX
      run: npx --yes @vscode/vsce package --no-dependencies

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" ./*.vsix \
          --title "Githrun VS Code extension ${GITHUB_REF_NAME}" \
          --generate-notes
